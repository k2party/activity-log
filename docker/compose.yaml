# 行動記録メモ（Docker Compose）。ビルド: docker/build.sh  起動: docker compose -f docker/compose.yaml up -d
#   .env はこのファイルと同じ docker/ に置く（サンプルは docker/.env.sample）
# プロジェクト名を固定する（docker/ に移す前と同じ名前にし、既存のボリューム activity-log_db-data を引き継ぐ）
name: activity-log

services:
  app:
    build:
      context: ..                     # リポジトリ直下（app/ をコピーする）
      dockerfile: docker/Dockerfile   # 除外設定は docker/Dockerfile.dockerignore
    image: activity-log-app
    restart: unless-stopped
    ports:
      # ホストOSのnginx（リバースプロキシ）から接続する。外部からの直接アクセスを防ぐため 127.0.0.1 のみに公開
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - db-data:/data          # SQLiteファイルを永続化
    environment:
      # 1日の感想の AI 要約に使う Gemini のモデル（API キーは各ユーザーが画面の「Gemini設定」で登録する）
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Gemini API キーを DB に暗号化して保存するための秘密鍵（32文字以上）。docker/.env に GEMINI_KEY_SECRET=... と書く（サンプルは docker/.env.sample）
      # 生成例: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      GEMINI_KEY_SECRET: ${GEMINI_KEY_SECRET:-}
      # AI 要約にローカル LLM を使う場合の接続先（llm サービスなら http://llm:11434）。設定すると Gemini は使わない
      DIARY_LLM_URL: ${DIARY_LLM_URL:-}
      # ローカル LLM で使うモデル（既定 gemma3:1b。llm-init が取得するモデルと同じ）
      LLM_MODEL: ${LLM_MODEL:-}

  # ローカル LLM（Ollama）。プロファイル llm を指定したときだけ起動する:
  #   docker compose -f docker/compose.yaml --profile llm up -d   （または docker/.env に COMPOSE_PROFILES=llm）
  # 既定のモデル（LLM_MODEL。既定 gemma3:1b）は llm-init が起動時に自動で取得する。別のモデルを手動で取得する場合:
  #   docker compose -f docker/compose.yaml exec llm ollama pull <モデル名>
  # アプリの AI 要約に使うには docker/.env に DIARY_LLM_URL=http://llm:11434 と書く（Ollama には認証が無いため、ホストには公開しない）
  llm:
    image: ${OLLAMA_IMAGE:-docker.io/ollama/ollama:latest}
    profiles: ["llm"]
    restart: unless-stopped
    volumes:
      - llm-data:/root/.ollama   # 取得したモデルを永続化
    environment:
      # 最後の利用からモデルをメモリに載せておく時間（既定 5m。-1 で常駐）
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    # ホストから直接使う場合だけコメントを外す（127.0.0.1 のみ）
    #ports:
    #  - "127.0.0.1:11434:11434"
    # NVIDIA GPU を使う場合（ホストに NVIDIA Container Toolkit が必要）はコメントを外す
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: all
    #          capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # 既定のモデルを取得する1回限りのコンテナ（取得済みなら差分の確認だけで終わる）。llm の起動（ヘルスチェック成功）後に動く
  llm-init:
    image: ${OLLAMA_IMAGE:-docker.io/ollama/ollama:latest}
    profiles: ["llm"]
    restart: "no"
    depends_on:
      llm:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://llm:11434
    command: ["pull", "${LLM_MODEL:-gemma3:1b}"]   # イメージの ENTRYPOINT は ollama

volumes:
  db-data:
  llm-data:
